<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>IMD Weather Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

header {
  background:#b30000;
  color:white;
  padding:15px;
  text-align:center;
}

.section { display:none; padding:20px; }
.active { display:block; }

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card {
  padding:40px;
  background:#f5f5f5;
  text-align:center;
  cursor:pointer;
  border-radius:10px;
  font-size:18px;
}

.card:hover { background:#ffe6e6; }

#map { height:60vh; }

button {
  padding:8px;
  margin:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>IMD Weather Dashboard</h1>
</header>

<!-- ================= HOME ================= -->
<div id="home" class="section active">
<div class="grid">
<div class="card" onclick="showSection('single')">Single Location</div>
<div class="card" onclick="showSection('multi')">Multiple Locations</div>
<div class="card" onclick="showSection('mapSection')">View on Map</div>
<div class="card" onclick="showSection('realtime')">Realtime Data</div>
</div>
</div>

<!-- ================= SINGLE ================= -->
<div id="single" class="section">

<h2>Single Location</h2>

Param:
<select id="param">
<option value="rain">rain</option>
<option value="tmin">tmin</option>
<option value="tmax">tmax</option>
</select>

Lat: <input id="lat">
Lon: <input id="lon">
Start: <input type="date" id="start">
End: <input type="date" id="end">

<button onclick="fetchSingle()">Fetch</button>
<button onclick="showSection('home')">Back</button>

<canvas id="chart"></canvas>
<div id="table"></div>
<div id="metrics"></div>

</div>

<!-- ================= MAP ================= -->
<div id="mapSection" class="section">

<h2>Map View</h2>

Lat: <input id="mapLat">
Lon: <input id="mapLon">
Date: <input type="date" id="mapDate">

<select id="mapParam">
<option value="rain">rain</option>
<option value="tmin">tmin</option>
<option value="tmax">tmax</option>
</select>

<button onclick="loadMap()">Show</button>
<button onclick="showSection('home')">Back</button>

<div id="map"></div>

</div>

<!-- ================= MULTI ================= -->
<div id="multi" class="section">

<h2>Upload CSV (lat,lon)</h2>

<input type="file" id="csvFile">
<button onclick="processCSV()">Process</button>
<button onclick="showSection('home')">Back</button>

</div>

<!-- ================= REALTIME ================= -->
<div id="realtime" class="section">
<h2>Coming Soon 🚀</h2>
<button onclick="showSection('home')">Back</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="app.js"></script>

</body>
</html>
