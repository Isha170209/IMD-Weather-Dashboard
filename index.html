<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>IMD Weather Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="icon" href="data:,">

<style>
body {
  margin:0;
  font-family:Arial;
  overflow:hidden; /* ❌ no scroll */
}

header {
  background:#b30000;
  color:white;
  padding:10px 18px;
}

header h1 {
  margin:0;
  font-size:28px;
}

/* HOME */
#homePage {
  padding:30px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
}

.card {
  background:#f5f5f5;
  padding:30px;
  border-radius:10px;
  cursor:pointer;
  font-size:18px;
  text-align:center;
}

.card:hover {
  background:#b30000;
  color:white;
}

/* DASHBOARD */
#dashboardPage {
  display:none;
}

#controls {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
}

.filterTab {
  background:white;
  padding:8px;
  border-radius:6px;
  min-width:150px;
}

.tabTitle {
  font-size:14px;
  font-weight:bold;
}

input, select {
  width:100%;
}

button {
  margin-top:5px;
  padding:5px;
}

.btn-red { background:#b30000; color:white; }
.btn-white { background:white; border:1px solid #b30000; }

/* OUTPUT */
#output {
  display:flex;
  flex-direction:column;
  height:calc(100vh - 120px);
}

#chartContainer {
  height:40%;
}

#tablesContainer {
  display:flex;
  gap:10px;
  height:60%;
}

.tableBox {
  flex:1;
  overflow:auto;
}

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  border:1px solid #ccc;
  padding:4px;
  font-size:12px;
}
</style>
</head>

<body>

<header>
<h1>IMD Weather Dashboard</h1>
</header>

<!-- HOME -->
<div id="homePage">
<h2>Select Functionality</h2>

<div class="grid">
<div class="card" onclick="openDashboard()">Download IMD Gridded Data (Single Location)</div>
<div class="card" onclick="openDashboard()">Download IMD Gridded Data (Multiple Locations)</div>
<div class="card" onclick="openDashboard()">View IMD Gridded Data (On Map)</div>
<div class="card" onclick="openDashboard()">Download Realtime IMD Gridded Data</div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">

<button onclick="goHome()" class="btn-white">⬅ Back</button>

<div id="controls">

<div class="filterTab">
<div class="tabTitle">Parameter</div>
<select id="param">
<option value="rain">rain</option>
<option value="tmin">tmin</option>
<option value="tmax">tmax</option>
</select>
</div>

<div class="filterTab">
<div class="tabTitle">Latitude</div>
<input type="number" id="lat">
</div>

<div class="filterTab">
<div class="tabTitle">Longitude</div>
<input type="number" id="lon">
</div>

<div class="filterTab">
<div class="tabTitle">Start</div>
<input type="date" id="startDate">
</div>

<div class="filterTab">
<div class="tabTitle">End</div>
<input type="date" id="endDate">
</div>

<div class="filterTab">
<div class="tabTitle">Action</div>
<button id="submitBtn" class="btn-red">Submit</button>
<button id="resetBtn" class="btn-white">Reset</button>
<button id="downloadBtn" class="btn-red">CSV</button>
</div>

</div>

<!-- OUTPUT -->
<div id="output">

<div id="chartContainer">
<canvas id="chart"></canvas>
</div>

<div id="tablesContainer">

<div class="tableBox" id="dailyTable"></div>

<div class="tableBox" id="summaryTable"></div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./app.js" type="module"></script>

</body>
</html>
