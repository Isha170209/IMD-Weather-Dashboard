<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weather Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body { margin:0; font-family:Arial; }

header {
  background:#b30000;
  color:white;
  padding:12px 18px;
}

header h1 {
  margin:0;
  font-size:40px;
}

#controls {
  display:flex;
  gap:12px;
  margin-top:10px;
  flex-wrap:wrap;
}

.filterTab {
  background:white;
  color:black;
  padding:10px;
  border-radius:6px;
  min-width:160px;
}

.tabTitle {
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

select, input {
  width:100%;
  padding:6px;
  font-size:20px;
}

button {
  padding:7px;
  font-size:20px;
  margin-top:4px;
  border:none;
  cursor:pointer;
  border-radius:4px;
}

.btn-red { background:#b30000; color:white; }
.btn-white { background:white; color:#b30000; border:1px solid #b30000; }

#map {
  height:60vh;
}

#status {
  position:absolute;
  top:90px;
  right:20px;
  background:white;
  padding:8px;
  border-radius:5px;
  font-size:15px;
  z-index:999;
}

#chart {
  width:100%;
  height:250px;
}

#table {
  margin-top:10px;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}

th, td {
  border:1px solid #ddd;
  padding:6px;
}
</style>
</head>

<body>

<header>
<h1>Weather Dashboard</h1>

<div id="controls">

<div class="filterTab">
<div class="tabTitle">Parameter</div>
<select id="param">
<option value="rain">Rainfall</option>
<option value="tmin">Tmin</option>
<option value="tmax">Tmax</option>
</select>
</div>

<div class="filterTab">
<div class="tabTitle">Latitude</div>
<input type="number" id="lat" placeholder="19.07">
</div>

<div class="filterTab">
<div class="tabTitle">Longitude</div>
<input type="number" id="lon" placeholder="72.87">
</div>

<div class="filterTab">
<div class="tabTitle">Start Date</div>
<input type="date" id="startDate">
</div>

<div class="filterTab">
<div class="tabTitle">End Date</div>
<input type="date" id="endDate">
</div>

<div class="filterTab">
<div class="tabTitle">Actions</div>
<button id="submitBtn" class="btn-red">Submit</button>
<button id="resetBtn" class="btn-white">Reset</button>
<button id="downloadBtn" class="btn-red">Download CSV</button>
</div>

</div>
</header>

<main>
<div id="map"></div>
<div id="status"></div>

<canvas id="chart"></canvas>
<div id="table"></div>
</main>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
