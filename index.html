<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IMD Weather Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Style -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #b30000;
      color: white;
      padding: 10px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    #controls {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .filterTab {
      background: white;
      color: black;
      padding: 6px;
      border-radius: 5px;
      min-width: 140px;
    }

    .tabTitle {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    select, input {
      width: 100%;
      padding: 4px;
    }

    button {
      padding: 6px 10px;
      background: #b30000;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    #map {
      height: calc(100vh - 120px);
    }

    #status {
      position: absolute;
      top: 80px;
      right: 20px;
      background: white;
      padding: 6px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 999;
    }
  </style>
</head>

<body>

<header>
  <h1>IMD Gridded Weather Dashboard</h1>

  <div id="controls">

    <div class="filterTab">
      <div class="tabTitle">Parameter</div>
      <select id="param">
        <option value="rain">Rainfall</option>
        <option value="tmin">Tmin</option>
        <option value="tmax">Tmax</option>
      </select>
    </div>

    <div class="filterTab">
      <div class="tabTitle">Latitude</div>
      <input type="number" id="lat" placeholder="e.g. 19.07">
    </div>

    <div class="filterTab">
      <div class="tabTitle">Longitude</div>
      <input type="number" id="lon" placeholder="e.g. 72.87">
    </div>

    <div class="filterTab">
      <div class="tabTitle">Start Date</div>
      <input type="date" id="startDate">
    </div>

    <div class="filterTab">
      <div class="tabTitle">End Date</div>
      <input type="date" id="endDate">
    </div>

    <div class="filterTab">
      <div class="tabTitle">Action</div>
      <button id="submitBtn">Submit</button>
      <button id="resetBtn" style="margin-top:5px;background:white;color:#b30000;border:1px solid #b30000;">Reset</button>
    </div>

  </div>
</header>

<main>
  <div id="map"></div>
  <div id="status"></div>
</main>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="js/app.js" defer></script>

</body>
</html>
