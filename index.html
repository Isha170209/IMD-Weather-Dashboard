<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>IMD Weather Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="icon" href="data:,">

<style>
body { margin:0; font-family:Arial; }

header {
  background:#b30000;
  color:white;
  padding:12px 18px;
}

header h1 {
  margin:0;
  font-size:32px;
}

/* ================= HOME PAGE ================= */
#homePage {
  padding:30px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
}

.card {
  background:#f5f5f5;
  padding:30px;
  border-radius:10px;
  cursor:pointer;
  font-size:20px;
  text-align:center;
  transition:0.2s;
}

.card:hover {
  background:#b30000;
  color:white;
}

/* ================= DASHBOARD ================= */
#dashboardPage {
  display:none;
}

#controls {
  display:flex;
  gap:12px;
  margin-top:10px;
  flex-wrap:wrap;
}

.filterTab {
  background:white;
  color:black;
  padding:10px;
  border-radius:6px;
  min-width:160px;
}

.tabTitle {
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

select, input {
  width:100%;
  padding:6px;
  font-size:16px;
}

button {
  padding:7px;
  font-size:16px;
  margin-top:4px;
  border:none;
  cursor:pointer;
  border-radius:4px;
}

.btn-red { background:#b30000; color:white; }
.btn-white { background:white; color:#b30000; border:1px solid #b30000; }

#map { height:60vh; }

#status {
  position:absolute;
  top:90px;
  right:20px;
  background:white;
  padding:8px;
  border-radius:5px;
  font-size:14px;
  z-index:999;
}

#chart { width:100%; height:250px; }

table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th, td {
  border:1px solid #ddd;
  padding:6px;
}

.checkbox-label {
  display:flex;
  align-items:center;
  gap:8px;
}

#backBtn {
  margin:10px;
}
</style>
</head>

<body>

<header>
<h1>IMD Weather Dashboard</h1>
</header>

<!-- ================= HOME PAGE ================= -->
<div id="homePage">

<h2>Select Functionality</h2>

<div class="grid">

<div class="card" onclick="openDashboard()">
Download IMD Gridded Data (Single Location)
</div>

<div class="card" onclick="openDashboard()">
Download IMD Gridded Data (Multiple Locations)
</div>

<div class="card" onclick="openDashboard()">
View IMD Gridded Data (On Map)
</div>

<div class="card" onclick="openDashboard()">
Download Realtime IMD Gridded Data
</div>

</div>
</div>

<!-- ================= DASHBOARD PAGE ================= -->
<div id="dashboardPage">

<button id="backBtn" class="btn-white" onclick="goHome()">⬅ Back</button>

<header>
<h1>Weather Dashboard</h1>

<div id="controls">

<div class="filterTab">
<div class="tabTitle">Parameter</div>
<select id="param">
<option value="rain">rain</option>
<option value="tmin">tmin</option>
<option value="tmax">tmax</option>
</select>
</div>

<div class="filterTab">
<div class="tabTitle">Latitude</div>
<input type="number" id="lat">
</div>

<div class="filterTab">
<div class="tabTitle">Longitude</div>
<input type="number" id="lon">
</div>

<div class="filterTab">
<div class="tabTitle">Start Date</div>
<input type="date" id="startDate">
</div>

<div class="filterTab">
<div class="tabTitle">End Date</div>
<input type="date" id="endDate">
</div>

<div class="filterTab">
<div class="tabTitle">Aggregation</div>
<label class="checkbox-label">
<input type="checkbox" id="monthlyToggle"> Monthly
</label>
</div>

<div class="filterTab">
<div class="tabTitle">Actions</div>
<button id="submitBtn" class="btn-red">Submit</button>
<button id="resetBtn" class="btn-white">Reset</button>
<button id="downloadBtn" class="btn-red">Download CSV</button>
</div>

</div>
</header>

<main>
<div id="map"></div>
<div id="status"></div>
<canvas id="chart"></canvas>
<div id="table"></div>
</main>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./app.js" type="module"></script>

</body>
</html>
