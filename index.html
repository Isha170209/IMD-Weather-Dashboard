<!DOCTYPE html>
<html>
<head>
  <title>Weather Dashboard</title>

  <!-- Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family:Arial; display:flex; }

    #sidebar {
      width:300px;
      background:#b30000;
      color:white;
      padding:20px;
      height:100vh;
      overflow:auto;
      transition:0.3s;
    }

    #sidebar.hidden { margin-left:-300px; }

    #main { flex:1; padding:20px; background:#f5f5f5; }

    button {
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-red { background:#b30000; color:white; }
    .btn-white { background:white; color:#b30000; border:2px solid #b30000; }

    input, select { width:100%; padding:6px; margin:5px 0; }

    #toggleBtn {
      position:absolute;
      top:10px;
      left:10px;
      background:#b30000;
      color:white;
      border:none;
      padding:8px;
      cursor:pointer;
    }

    table {
      width:100%;
      border-collapse:collapse;
      background:white;
    }

    table, th, td {
      border:1px solid #ddd;
      padding:6px;
    }
  </style>
</head>

<body>

<button id="toggleBtn" onclick="toggleSidebar()">☰</button>

<div id="sidebar">

  <h3>Filters</h3>

  <select id="param">
    <option value="rain">Rainfall</option>
    <option value="tmin">Tmin</option>
    <option value="tmax">Tmax</option>
  </select>

  <input type="number" id="lat" placeholder="Latitude">
  <input type="number" id="lon" placeholder="Longitude">

  <input type="date" id="startDate">
  <input type="date" id="endDate">

  <button class="btn-red" onclick="fetchData()">Submit</button>
  <button class="btn-white" onclick="resetForm()">Reset</button>
  <button class="btn-red" onclick="downloadCSV()">Download CSV</button>

  <hr>

  <h3>Multiple Locations</h3>
  <input type="file" id="csvFile" accept=".csv">
  <button class="btn-red" onclick="processCSV()">Upload & Process</button>

</div>

<div id="main">
  <h2>Weather Dashboard</h2>

  <div id="status"></div>

  <canvas id="chart"></canvas>

  <br>

  <div id="table"></div>

  <h3>Map View</h3>
  <div id="map" style="height:500px;"></div>
</div>

<script type="module" src="./app.js"></script>

</body>
</html>
