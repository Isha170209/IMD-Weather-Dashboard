name: IMD Weather Pipeline

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:

jobs:

  run_pipeline:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Script
      run: |
        python scripts/imd_realtime_pipeline.py

    - name: Commit Parquet Files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        if ls data/realtime/*.parquet 1> /dev/null 2>&1; then
            git add data/realtime/*.parquet
            git commit -m "Daily IMD data update"
            git push
        else
           echo "No parquet files generated"
        fi
