name: IMD Realtime Pipeline

on:
  schedule:
    - cron: '30 2 * * *'   # runs daily (adjust if needed)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # ============================
    # STEP 1: CHECKOUT REPO
    # ============================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================
    # STEP 2: SETUP PYTHON
    # ============================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # ============================
    # STEP 3: RUN SCRIPT
    # ============================
    - name: Run IMD pipeline
      run: |
        python scripts/imd_realtime_pipeline.py

    # ============================
    # STEP 4: COMMIT & PUSH (FIXED)
    # ============================
    - name: Commit and Push Parquet Files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"

        # Add parquet files
        git add data/realtime/*.parquet || echo "No parquet files to add"

        # Commit only if changes exist
        git diff --cached --quiet || git commit -m "Daily IMD data update"

        # ✅ FIXED PUSH (WITH AUTH)
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
