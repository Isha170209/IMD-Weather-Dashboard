name: IMD Realtime Pipeline

on:
  schedule:
    - cron: '30 2 * * *'   # runs daily (adjust if needed)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 🔥 VERY IMPORTANT (fixes 403 error)

    steps:

    # ============================
    # STEP 1: Checkout repo
    # ============================
    - name: Checkout repository
      uses: actions/checkout@v3

    # ============================
    # STEP 2: Setup Python
    # ============================
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ============================
    # STEP 3: Install dependencies
    # ============================
    - name: Install dependencies
      run: |
        pip install imdlib pandas numpy pyarrow openpyxl

    # ============================
    # STEP 4: Run script
    # ============================
    - name: Run IMD pipeline
      run: python scripts/imd_realtime_pipeline.py

    # ============================
    # STEP 5: Commit & Push
    # ============================
    - name: Commit and Push data
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"

        # 🔥 ADD ALL parquet files recursively
        git add data/realtime/**/*.parquet || true

        # check if anything to commit
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily IMD data update"
          git push
        fi
