name: One-time Parquet to CSV

on:
  workflow_dispatch:   # manual trigger only

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow

      - name: Convert parquet to CSV
        run: |
          python <<EOF
          import pandas as pd
          import glob
          import os

          files = glob.glob("data/**/*.parquet", recursive=True)

          for file in files:
              print("Processing:", file)

              df = pd.read_parquet(file)

              # OPTIONAL: keep only required columns
              cols = [c for c in ["date","lat","lon","rain","tmax","tmin"] if c in df.columns]
              df = df[cols]

              out_file = file.replace(".parquet", ".csv")
              df.to_csv(out_file, index=False)

              print("Saved:", out_file)

          EOF

      - name: Commit CSV files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Converted parquet to CSV (one-time)" || echo "No changes"
          git push
