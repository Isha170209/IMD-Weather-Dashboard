name: Convert Parquet to CSV

on:
  workflow_dispatch:   # manual run from GitHub Actions tab

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas pyarrow fastparquet

      - name: Convert Parquet → CSV
        run: |
          import os
          import pandas as pd

          input_dir = "data"
          output_dir = "csv_output"
          os.makedirs(output_dir, exist_ok=True)

          for root, dirs, files in os.walk(input_dir):
              for file in files:
                  if file.endswith(".parquet"):
                      parquet_path = os.path.join(root, file)

                      print(f"Processing {parquet_path}")

                      df = pd.read_parquet(parquet_path)

                      relative_path = os.path.relpath(root, input_dir)
                      save_dir = os.path.join(output_dir, relative_path)
                      os.makedirs(save_dir, exist_ok=True)

                      csv_name = file.replace(".parquet", ".csv")
                      csv_path = os.path.join(save_dir, csv_name)

                      df.to_csv(csv_path, index=False)

      - name: Commit CSV files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add csv_output

          git commit -m "Auto convert parquet to csv" || echo "No changes"

          git push
